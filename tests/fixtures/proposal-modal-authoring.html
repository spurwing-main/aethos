<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tripleseat.css"><style>body{position:relative;margin:0;font:16px sans-serif}main{padding:80px 24px}input{display:block;margin:24px 0;padding:12px}#vendor-spacer{height:600px}.display-none{display:none!important}</style></head><body style="position:relative"><main><a href="#proposal-form">Request information</a><section id="proposal-form" data-proposal-modal="enabled"><div class="proposal" style="display:grid"><div class="proposal_media">Author image</div><h2>Get your individual proposal</h2><p>Plan your event with Aethos.</p><div data-proposal-modal-open="proposal-form"><a id="authored-link" class="custom-design" href="#"><span>Open enquiry</span></a></div><div class="display-none" data-proposal-modal-content><form action="https://api.tripleseat.com/ts/dynamic_leads" id="dynamic_lead_form"><label>Name<input id="test-name" required></label><label>Events needed<input type="checkbox" id="test-events"></label><div id="vendor-spacer"></div><button type="button">Add event</button></form><a href="https://tripleseat.com">Powered by Tripleseat</a></div></div></section><form id="native-form"><label>Newsletter<input type="email"></label></form></main><script>window.aethos={functions:{},helpers:{}};
const mode=new URLSearchParams(location.search).get('mode');const section=document.querySelector('#proposal-form'),content=document.querySelector('[data-proposal-modal-content]');
if(mode==='css-missing')section.style.setProperty('--proposal-modal-ready','0');
if(mode==='native')document.querySelector('#dynamic_lead_form').classList.add('proposal-form');
if(mode==='legacy'){const script=document.createElement('script');script.type='text/plain';script.src='https://api.tripleseat.com/v1/leads/ts_script.js';content.append(script);}
if(mode==='late'||mode==='failure'||mode==='namespace-reset'){const form=document.querySelector('#dynamic_lead_form');form.remove();if(mode==='late'||mode==='namespace-reset')setTimeout(()=>content.prepend(form),100);}
if(mode==='failure'){const originalTimeout=window.setTimeout;window.setTimeout=(fn,ms,...args)=>originalTimeout(fn,ms===15000?20:ms,...args);}
if(mode==='header-controls'||mode==='dropdown-open'){const h=document.createElement('header');h.innerHTML='<div class="lang-switcher"><button class="lang-switcher_dd-toggle" aria-expanded="false">EN</button></div><div class="booking without-modal"><button>Book now</button></div>';document.body.prepend(h);if(mode==='dropdown-open')h.querySelector('button').classList.add('w--open');}
if(mode==='busy')document.body.classList.add('nav-open');
if(mode==='promotion-closing'){aethos.helpers.promoClosePromise=new Promise(resolve=>setTimeout(()=>{aethos.helpers.promoClosePromise=null;resolve();},10));}
if(mode==='promotion'){document.documentElement.classList.add('promopop-open');aethos.helpers.closePromoForProposal=()=>new Promise(resolve=>setTimeout(()=>{document.documentElement.classList.remove('promopop-open');resolve();},10));}
fetch('../../aethos.js',{cache:'no-store'}).then(r=>r.text()).then(t=>{const code=t.split('/* PROPOSAL MODAL START */')[1]?.split('/* PROPOSAL MODAL END */')[0];if(code)(0,eval)(code);if(mode==='namespace-reset'){aethos.functions.proposalModal();window.aethos={functions:{},helpers:{}};(0,eval)(code);aethos.functions.proposalModal();}window.fixtureReady=true;});</script></body></html>
